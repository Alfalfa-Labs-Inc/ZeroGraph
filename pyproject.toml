[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diffusionblocks-independent"
version = "0.4.0"
description = "ZeroGraph: independent block training with materialized supervision"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Alfalfa Labs, Inc."}]
keywords = ["pytorch", "distributed-training", "blockwise-learning", "diffusion", "machine-learning"]
dependencies = ["diffusionblocks-v5==0.17.0"]

[project.optional-dependencies]
dev = ["build>=1.3", "pytest>=9.0"]

[project.scripts]
diffusionblocks-independent = "diffusionblocks_independent.cli:main"
zerograph = "diffusionblocks_independent.cli:main"

[project.urls]
Homepage = "https://github.com/Alfalfa-Labs-Inc/ZeroGraph"
Repository = "https://github.com/Alfalfa-Labs-Inc/ZeroGraph"
Issues = "https://github.com/Alfalfa-Labs-Inc/ZeroGraph/issues"
Changelog = "https://github.com/Alfalfa-Labs-Inc/ZeroGraph/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
