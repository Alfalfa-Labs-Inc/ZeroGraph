name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install source-only dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch pytest build
          python -m pip install -e . --no-deps
      - name: Source-only unit tests
        run: pytest -q tests/test_concurrency.py tests/test_materialized.py
      - name: Build wheel and sdist
        run: python -m build

  public-integration:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ExactGraph and ZeroGraph
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'git+https://github.com/Alfalfa-Labs-Inc/ExactGraph.git'
          python -m pip install -e '.[dev]' --no-deps
      - name: Full integration suite
        run: pytest -q
