name: Bug report
description: Report a reproducible ZeroGraph defect.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private weights, or security vulnerabilities.
  - type: input
    id: version
    attributes:
      label: ZeroGraph and ExactGraph versions or commits
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python, PyTorch, CUDA, accelerator topology, and OS.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I removed secrets and proprietary data.
          required: true
        - label: This is not a security vulnerability.
          required: true
